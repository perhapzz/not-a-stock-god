services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - backend-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://20.205.124.180:8001
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
